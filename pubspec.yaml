name: gym_tracker
description: "Personal gym tracker with local storage: routines, logged sets, statistics and reports (English / Spanish)."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.3.1
  go_router: ^18.1.3
  intl: ^0.20.2
  path: ^1.9.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.6
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
